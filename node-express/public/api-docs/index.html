<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>DB Migrator — API Reference</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui.css" />
<style>
  body { margin: 0; background: #fafafa; }
  .topbar-banner {
    background: #c2410c; color: white; padding: 10px 20px; font: 13px -apple-system, sans-serif;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar-banner a { color: #fde68a; text-decoration: none; }
</style>
</head>
<body>
  <div class="topbar-banner">
    <span>DB Migrator <b>client</b> · OpenAPI 3.0 reference</span>
    <span>
      <a href="/openapi.json">Raw spec</a> ·
      <a href="/">回到 app</a> ·
      <a href="/docs/">使用文件</a>
    </span>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" defer></script>
  <script>
    window.addEventListener('load', () => {
      window.ui = SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger-ui',
        presets: [ SwaggerUIBundle.presets.apis ],
        layout: 'BaseLayout',
        tryItOutEnabled: true,
        persistAuthorization: true,
      });
    });
  </script>
</body>
</html>
