name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-app:
    name: Node app (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20]
    defaults:
      run:
        working-directory: node-express
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node-express/package-lock.json
      # better-sqlite3 needs Python on Linux for node-gyp
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Smoke boot
        run: |
          node -e "process.env.PORT='0'; require('./server.js'); setTimeout(()=>process.exit(0), 1500);"

  license-server:
    name: License server (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20]
    defaults:
      run:
        working-directory: license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: license-server/package-lock.json
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test

  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: dotnet8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
